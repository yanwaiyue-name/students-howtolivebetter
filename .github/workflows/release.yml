name: 构建与发布
# 正文一改就重新生成 5 种格式，挂到固定的 Release "latest" 上，下载链接不变。
# PR 只构建不发布，产物在 Actions 的 artifact 里。

on:
  push:
    branches: [main]
    paths:
      - 'book/**'
      - 'tools/**'
      - 'README.md'
      - 'package.json'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'book/**'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: npm install --silent

      - name: 格式检查
        run: node tools/check-format.mjs

      - name: 统计检查
        run: node tools/check-stats.mjs

      - name: 构建全部格式
        run: node tools/build-all.mjs

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: book-dist
          path: dist/
          if-no-files-found: error

      - name: 发布到 Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # latest 是固定 tag，下载链接永久有效。
          # 不能先 delete 再 create：create 失败时 latest 会凭空消失，所有下载链接一起 404。
          # 已有 release 就 upload --clobber 覆盖同名资产；没有才新建。
          NOTES="正文更新于 $(date -u '+%Y-%m-%d %H:%M UTC')

          包含 5 种格式：网页版 / Markdown / 纯文本 / EPUB / PDF。"
          FILES="dist/index.html dist/students-howtolivebetter.md dist/students-howtolivebetter.txt dist/students-howtolivebetter.epub dist/students-howtolivebetter.pdf"
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest $FILES --clobber
            gh release edit latest --title "最新构建" --notes "$NOTES"
          else
            gh release create latest --title "最新构建" --notes "$NOTES" $FILES
          fi

  deploy-pages:
    name: 部署网页版
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: book-dist
          path: site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
